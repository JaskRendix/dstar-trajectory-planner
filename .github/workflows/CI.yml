name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        
      - name: Check formatting
        run: cargo fmt --all -- --check
        
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        
      - name: Run tests
        run: cargo test --all --verbose

      - name: Run examples
        run: |
          cargo run --example corridor
          cargo run --example dynamic
          cargo run --example maze
          cargo run --example minimal
          cargo run --example planner
          cargo run --example u_shape
          cargo run --example virtual_paths
          cargo run --example virtual_walls_json