[package]
name = "dstar-trajectory-planner"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.8"

[[bench]]
name = "dstar_bench"
harness = false

[[bench]]
name = "large_map_bench"
harness = false

[[bench]]
name = "neighbor_modes_bench"
harness = false

[[bench]]
name = "potential_field_bench"
harness = false

[[bench]]
name = "weighted_costmap_bench"
harness = false
